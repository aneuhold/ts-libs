name: 'Setup Node.js and pnpm'
description: 'Setup Node.js, pnpm, and install dependencies with caching'

runs:
  using: 'composite'
  steps:
    - name: Configure the npm registry
      # Writes the .npmrc that `npm publish` reads, which npm requires for OIDC:
      # https://docs.npmjs.com/trusted-publishers. No node-version is given
      # because pnpm/setup below installs the runtime.
      uses: actions/setup-node@v6
      with:
        registry-url: 'https://registry.npmjs.org'

    - name: Setup pnpm, Node.js, and install dependencies
      uses: pnpm/setup@v2
      with:
        runtime: node@lts
        cache: true

    - name: Update NPM to latest
      # This needs to be 11.5.1 or later for OIDC support
      shell: bash
      run: npm install -g npm@latest

    - name: Setup yarn classic and yarn berry
      shell: bash
      run: |
        corepack enable
        cd ~
        yarn set version classic
        cd $GITHUB_WORKSPACE
