name: 'Setup Node.js and pnpm'
description: 'Setup Node.js, pnpm, and install dependencies with caching'

runs:
  using: 'composite'
  steps:
    # Reads the pnpm version from `packageManager`, installs the runtime, and runs
    # `pnpm install`
    - name: Setup pnpm, Node.js, and install dependencies
      uses: pnpm/setup@v2
      with:
        runtime: node@lts
        cache: true

    # npm needs to be 11.5.1 or later for OIDC support. `pnpm/setup` only links
    # `node` onto the PATH, so `npm` otherwise resolves to the runner image's
    # copy.
    - name: Update NPM to latest
      shell: bash
      run: |
        pnpm add -g npm@latest
        npm --version

    # Only the yarn shim is enabled, so the pnpm that `pnpm/setup` installed stays
    # the one on the PATH
    - name: Setup yarn classic and yarn berry
      shell: bash
      run: |
        corepack enable yarn
        cd ~
        yarn set version classic
        cd $GITHUB_WORKSPACE
